namespace: edge

image: nginx:1.27-alpine
replicas: 1

# Public vhosts (ADR 0014). Override per Environment in values/*-edge.yaml.
hosts:
  apex: azersoft.nc
  auth: auth.azersoft.nc
  apps: apps.azersoft.nc
  espaceApps: espace.apps.azersoft.nc

# Local: mkcert Secret via `just tls-local`. Droplet: false until cert-manager / host mount.
tls:
  enabled: false
  secretName: edge-tls

# hostPort for mono-node; use NodePort/LB later if needed
hostPorts:
  http: 80
  https: 443

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Upstream ClusterIPs (platform / apps namespaces). Disable when target is not deployed.
upstreams:
  www:
    enabled: true
    host: azr-www.apps.svc.cluster.local:8080
  shipping:
    enabled: true
    host: nc-shipping-rates.apps.svc.cluster.local:3000
  keycloak:
    enabled: true
    host: keycloak.platform.svc.cluster.local:8080
  gateway:
    enabled: true
    host: gateway.platform.svc.cluster.local:8000
  clientSpace:
    enabled: false
    host: client-space.apps.svc.cluster.local:3000
