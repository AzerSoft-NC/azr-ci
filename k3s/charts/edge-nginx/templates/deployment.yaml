{{- $tls := .Values.tls.enabled -}}
{{- $h := .Values.hosts -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-nginx-conf
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "edge-nginx.labels" . | nindent 4 }}
data:
  nginx.conf: |
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;
    events { worker_connections 1024; }
    http {
      include       /etc/nginx/mime.types;
      default_type  application/octet-stream;
      sendfile        on;
      keepalive_timeout  65;
      include /etc/nginx/conf.d/*.conf;
    }
  default.conf: |
    {{- if .Values.upstreams.www.enabled }}
    upstream www { server {{ .Values.upstreams.www.host }}; }
    {{- end }}
    {{- if .Values.upstreams.shipping.enabled }}
    upstream shipping { server {{ .Values.upstreams.shipping.host }}; }
    {{- end }}
    {{- if .Values.upstreams.keycloak.enabled }}
    upstream keycloak { server {{ .Values.upstreams.keycloak.host }}; }
    {{- end }}
    {{- if .Values.upstreams.gateway.enabled }}
    upstream gateway { server {{ .Values.upstreams.gateway.host }}; }
    {{- end }}
    {{- if .Values.upstreams.clientSpace.enabled }}
    upstream client_space { server {{ .Values.upstreams.clientSpace.host }}; }
    {{- end }}

    {{- if $tls }}
    # HTTP: readiness + redirect to HTTPS (ADR 0014)
    server {
      listen 80 default_server;
      server_name {{ $h.apex }} {{ $h.auth }} {{ $h.apps }} {{ $h.espaceApps }} localhost _;

      location /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
      }

      location / {
        return 301 https://$host$request_uri;
      }
    }
    {{- end }}

    server {
      {{- if $tls }}
      {{ include "edge-nginx.listen-https" . | nindent 6 }}
      {{- else }}
      listen 80 default_server;
      {{- end }}
      server_name {{ $h.apex }} localhost _;

      location /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
      }

      {{- if .Values.upstreams.shipping.enabled }}
      location = /shopify-nc-shipping-rates {
        return 301 $scheme://$host/shopify-nc-shipping-rates/$is_args$args;
      }
      location /shopify-nc-shipping-rates/ {
        proxy_pass http://shipping/;
        {{- include "edge-nginx.proxy-headers" . | nindent 8 }}
      }
      {{- end }}

      {{- if .Values.upstreams.gateway.enabled }}
      location /api/ {
        proxy_pass http://gateway/;
        {{- include "edge-nginx.proxy-headers" . | nindent 8 }}
      }
      {{- end }}

      {{- if .Values.upstreams.clientSpace.enabled }}
      location = /plein-cap/espace-client {
        return 301 $scheme://$host/plein-cap/espace-client/$is_args$args;
      }
      location /plein-cap/espace-client/ {
        proxy_pass http://client_space/;
        {{- include "edge-nginx.proxy-headers" . | nindent 8 }}
      }
      {{- end }}

      {{- if .Values.upstreams.www.enabled }}
      location / {
        proxy_pass http://www;
        {{- include "edge-nginx.proxy-headers" . | nindent 8 }}
      }
      {{- else }}
      location / {
        return 503 'upstream www disabled';
        add_header Content-Type text/plain;
      }
      {{- end }}
    }

    {{- if or .Values.upstreams.shipping.enabled .Values.upstreams.gateway.enabled }}
    server {
      {{- if $tls }}
      {{ include "edge-nginx.listen-https" . | nindent 6 }}
      {{- else }}
      listen 80;
      {{- end }}
      server_name {{ $h.apps }};

      {{- if .Values.upstreams.shipping.enabled }}
      location /shopify-nc-shipping-rates/ {
        proxy_pass http://shipping/;
        {{- include "edge-nginx.proxy-headers" . | nindent 8 }}
      }
      {{- end }}

      {{- if .Values.upstreams.gateway.enabled }}
      location /api/ {
        proxy_pass http://gateway/;
        {{- include "edge-nginx.proxy-headers" . | nindent 8 }}
      }
      {{- end }}
    }
    {{- end }}

    {{- if .Values.upstreams.clientSpace.enabled }}
    server {
      {{- if $tls }}
      {{ include "edge-nginx.listen-https" . | nindent 6 }}
      {{- else }}
      listen 80;
      {{- end }}
      server_name {{ $h.espaceApps }};

      location = /api/health {
        proxy_pass http://client_space;
        {{- include "edge-nginx.proxy-headers" . | nindent 8 }}
      }
      location = /api/reset {
        proxy_pass http://client_space;
        {{- include "edge-nginx.proxy-headers" . | nindent 8 }}
      }
      location /api/auth/ {
        proxy_pass http://client_space;
        {{- include "edge-nginx.proxy-headers" . | nindent 8 }}
      }
      location /reset/ {
        proxy_pass http://client_space;
        {{- include "edge-nginx.proxy-headers" . | nindent 8 }}
      }
      {{- if .Values.upstreams.gateway.enabled }}
      location /api/trpc {
        proxy_pass http://gateway;
        {{- include "edge-nginx.proxy-headers" . | nindent 8 }}
      }
      {{- end }}
      location / {
        proxy_pass http://client_space;
        {{- include "edge-nginx.proxy-headers" . | nindent 8 }}
      }
    }
    {{- end }}

    {{- if .Values.upstreams.keycloak.enabled }}
    server {
      {{- if $tls }}
      {{ include "edge-nginx.listen-https" . | nindent 6 }}
      {{- else }}
      listen 80;
      {{- end }}
      server_name {{ $h.auth }};

      location / {
        proxy_pass http://keycloak;
        {{- include "edge-nginx.proxy-headers" . | nindent 8 }}
      }
    }
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-nginx
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "edge-nginx.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  # hostPort 80/443: RollingUpdate deadlocks (old pod keeps ports → new Pending).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: edge-nginx
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge-nginx
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: nginx
          image: {{ .Values.image }}
          ports:
            - name: http
              containerPort: 80
              {{- if .Values.hostPorts.http }}
              hostPort: {{ .Values.hostPorts.http }}
              {{- end }}
            - name: https
              containerPort: 443
              {{- if .Values.hostPorts.https }}
              hostPort: {{ .Values.hostPorts.https }}
              {{- end }}
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            {{- if $tls }}
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: conf
          configMap:
            name: edge-nginx-conf
        {{- if $tls }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: edge-nginx
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "edge-nginx.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      name: http
    {{- if $tls }}
    - port: 443
      targetPort: https
      name: https
    {{- end }}
  selector:
    app.kubernetes.io/name: edge-nginx
    app.kubernetes.io/instance: {{ .Release.Name }}
