{{- if and .Values.mail.enabled .Values.mail.mailhog.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailhog
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: mailhog
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: mailhog
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: mailhog
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: mailhog
          image: {{ .Values.mail.mailhog.image }}
          ports:
            - containerPort: 1025
              name: smtp
            - containerPort: 8025
              name: http
          resources:
            {{- toYaml .Values.mail.mailhog.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: mailhog
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: mailhog
spec:
  type: ClusterIP
  ports:
    - port: 1025
      targetPort: smtp
      name: smtp
    - port: 8025
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/component: mailhog
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
