{{- if .Values.garage.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-meta
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: garage
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.garage.storageClassName }}
  storageClassName: {{ .Values.garage.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.garage.metaStorage }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-data
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: garage
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.garage.storageClassName }}
  storageClassName: {{ .Values.garage.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.garage.dataStorage }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: garage
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "sqlite"
    replication_factor = 1
    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "garage:3901"
    rpc_secret = "__RPC_SECRET_REPLACE__"
    bootstrap_peers = []

    [s3_api]
    s3_region = "{{ .Values.garage.s3Region }}"
    api_bind_addr = "[::]:3900"
    root_domain = ".s3.{{ .Values.garage.rootDomain }}"

    [s3_web]
    bind_addr = "[::]:3902"
    root_domain = ".web.{{ .Values.garage.rootDomain }}"

    [admin]
    api_bind_addr = "[::]:3903"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: garage
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: garage
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: garage
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      initContainers:
        - name: garage-config
          image: {{ .Values.garage.initImage }}
          command:
            - sh
            - -c
            - sed "s/__RPC_SECRET_REPLACE__/$RPC_SECRET/" /mnt/garage.toml > /mnt/etc/garage.toml
          env:
            - name: RPC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.garage.existingSecret }}
                  key: {{ .Values.garage.secretKeys.rpcSecret }}
          volumeMounts:
            - name: config-template
              mountPath: /mnt/garage.toml
              subPath: garage.toml
            - name: config
              mountPath: /mnt/etc
      containers:
        - name: garage
          image: {{ .Values.garage.image }}
          command: ["/garage"]
          args: ["-c", "/etc/garage/garage.toml", "server", "--single-node"]
          env:
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.garage.existingSecret }}
                  key: {{ .Values.garage.secretKeys.adminToken }}
          ports:
            - containerPort: 3900
              name: s3
            - containerPort: 3902
              name: web
            - containerPort: 3903
              name: admin
          volumeMounts:
            - name: config
              mountPath: /etc/garage
            - name: meta
              mountPath: /var/lib/garage/meta
            - name: data
              mountPath: /var/lib/garage/data
          resources:
            {{- toYaml .Values.garage.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: config-template
          configMap:
            name: garage-config
        - name: config
          emptyDir: {}
        - name: meta
          persistentVolumeClaim:
            claimName: garage-meta
        - name: data
          persistentVolumeClaim:
            claimName: garage-data
---
apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: garage
spec:
  type: ClusterIP
  ports:
    - port: 3900
      targetPort: s3
      name: s3
    - port: 3902
      targetPort: web
      name: web
    - port: 3903
      targetPort: admin
      name: admin
  selector:
    app.kubernetes.io/component: garage
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
