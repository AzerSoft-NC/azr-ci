{{- if .Values.mail.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mail
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: mail
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: mail
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: mail
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: mail
          image: {{ .Values.mail.image }}
          imagePullPolicy: {{ .Values.mail.imagePullPolicy }}
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: {{ .Values.mail.nodeEnv | quote }}
            - name: REQUIRE_AUTH
              value: {{ .Values.mail.requireAuth | toString | quote }}
            - name: BEHIND_PROXY
              value: {{ .Values.mail.behindProxy | toString | quote }}
            - name: SMTP_HOST
              value: {{ .Values.mail.smtp.host | quote }}
            - name: SMTP_PORT
              value: {{ .Values.mail.smtp.port | quote }}
            - name: SMTP_SECURE
              value: {{ .Values.mail.smtp.secure | quote }}
            - name: ALLOWED_ORIGINS
              value: {{ .Values.mail.allowedOrigins | quote }}
            {{- if .Values.mail.existingSecret }}
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mail.existingSecret }}
                  key: {{ .Values.mail.secretKeys.authToken }}
                  optional: true
            - name: APP_TOKENS_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mail.existingSecret }}
                  key: {{ .Values.mail.secretKeys.appTokensJson }}
                  optional: true
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mail.existingSecret }}
                  key: {{ .Values.mail.secretKeys.smtpUser }}
                  optional: true
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mail.existingSecret }}
                  key: {{ .Values.mail.secretKeys.smtpPass }}
                  optional: true
            {{- end }}
          ports:
            - containerPort: 3000
              name: http
          resources:
            {{- toYaml .Values.mail.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mail
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: mail
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/component: mail
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
