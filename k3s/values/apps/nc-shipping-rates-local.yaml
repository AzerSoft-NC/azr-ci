# nc-shipping-rates — local k3d (service + Prisma migrate Job)
kind: service
image: nc-shipping-rates:dev
imagePullPolicy: Never
replicas: 1

service:
  name: nc-shipping-rates
  port: 3000

existingSecret: nc-shipping-rates

# Placeholders for local k3d smoke (no real Shopify OAuth).
env:
  SHOPIFY_API_KEY: local-dev
  SHOPIFY_API_SECRET: local-dev
  SHOPIFY_APP_URL: https://apps.azersoft.local/shopify-nc-shipping-rates
  PORT: "3000"

migrate:
  enabled: true
  command: ["yarn", "db:migrate"]

readinessProbe:
  path: /healthz
livenessProbe:
  path: /healthz
