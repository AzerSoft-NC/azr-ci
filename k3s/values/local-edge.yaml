# edge-nginx — k3d local (ADR 0014: HTTPS mkcert + host matrix)
hostPorts:
  http: 80
  https: 443
image: nginx:1.27-alpine

hosts:
  apex: azersoft.local
  auth: auth.azersoft.local
  apps: apps.azersoft.local
  espaceApps: espace.apps.azersoft.local

tls:
  enabled: true
  secretName: edge-tls

# Horizon 1: Keycloak vhost on; app / Kong upstreams off until deployed
upstreams:
  www:
    enabled: false
  shipping:
    enabled: false
  keycloak:
    enabled: true
  gateway:
    enabled: false
