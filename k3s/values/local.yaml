# k3d / laptop — Horizon 1: Nginx + Postgres + Keycloak (ADR 0012)
postgres:
  storage: 4Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

valkey:
  enabled: false

garage:
  enabled: false
  metaStorage: 256Mi
  dataStorage: 5Gi

keycloak:
  enabled: true
  hostname: auth.azersoft.local
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: "1"
      memory: 768Mi

gateway:
  enabled: false

mail:
  enabled: true
  requireAuth: false
  imagePullPolicy: IfNotPresent
  smtp:
    host: mailhog
    port: "1025"
    secure: "false"
  mailhog:
    enabled: true
